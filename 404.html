<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Segovia Student Card</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px;
      background: #1b2452; color: #fcf6f5; font: 17px/1.5 Calibri, 'Helvetica Neue', Arial, sans-serif; }
    h1 { font: 900 clamp(2.4rem, 8vw, 4rem)/1 Cambria, Georgia, serif; text-transform: uppercase; margin: 0 0 14px; }
    a { display: inline-block; margin-top: 26px; background: #f96167; color: #1b2452; font-weight: 600; text-decoration: none;
      padding: 14px 28px; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <h1>Wrong turn</h1>
    <p>There is no page at this address.</p>
    <a id="home" href="/">Back to the card</a>
  </main>
  <script>
    // GitHub Pages serves this file for any missing path, at any depth, so the way home is worked out here.
    var onPages = /\.github\.io$/.test(location.hostname);
    document.getElementById('home').href = onPages ? '/' + location.pathname.split('/')[1] + '/' : '/';
  </script>
</body>
</html>
